<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-IT — Publicar Anúncio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 w-80 pointer-events-none"></div>

  <div class="flex min-h-screen">
    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col lg:ml-64">
      <div id="header-container"></div>

      <main class="flex-1 p-5 lg:p-7">
        <div class="max-w-2xl">

          <a href="./announcements.html" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-slate-800 mb-5 font-medium">
            <i class="fa-solid fa-arrow-left"></i>Voltar para Meus Anúncios
          </a>

          <div class="card">
            <h2 class="text-base font-bold text-slate-800 mb-1">Publicar Novo Anúncio</h2>
            <p class="text-sm text-slate-500 mb-6">Preencha as informações do resíduo que deseja ofertar no marketplace.</p>

            <form id="form-publish" onsubmit="handlePublish(event)">

              <!-- Seção 1: Identificação -->
              <div class="form-section">
                <p class="form-section-title">
                  <i class="fa-solid fa-box"></i> 1. Identificação do Material
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div class="sm:col-span-2">
                    <label class="form-label">Vincular ao Estoque</label>
                    <select id="ann-stock-link" class="form-input" onchange="prefillFromStock(this.value)">
                      <option value="">Selecionar item do estoque...</option>
                    </select>
                  </div>
                  <div>
                    <label class="form-label">Nome do Material *</label>
                    <input id="ann-name" type="text" placeholder="Ex: Aparas de Papel Branco" class="form-input" required />
                  </div>
                  <div>
                    <label class="form-label">Categoria *</label>
                    <select id="ann-category" class="form-input" required>
                      <option value="">Selecione...</option>
                      <option>Papel / Papelão</option>
                      <option>Plástico</option>
                      <option>Metal / Sucata</option>
                      <option>Madeira</option>
                      <option>Óleo</option>
                      <option>Borracha</option>
                      <option>Têxtil</option>
                      <option>Eletrônico</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Seção 2: Volume -->
              <div class="form-section">
                <p class="form-section-title">
                  <i class="fa-solid fa-weight-hanging"></i> 2. Volume e Precificação
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label class="form-label">Quantidade *</label>
                    <input id="ann-qty" type="number" placeholder="0" min="1" class="form-input" required />
                    <p id="ann-qty-error" class="error-msg">Informe um valor maior que zero.</p>
                  </div>
                  <div>
                    <label class="form-label">Unidade</label>
                    <select id="ann-unit" class="form-input">
                      <option>kg</option>
                      <option>tonelada</option>
                      <option>litro</option>
                      <option>m³</option>
                    </select>
                  </div>
                  <div>
                    <label class="form-label">Preço por kg (R$)</label>
                    <input id="ann-price" type="number" step="0.01" placeholder="0,00" min="0" class="form-input" />
                  </div>
                  <div class="sm:col-span-3">
                    <label class="form-label">Frequência de disponibilidade</label>
                    <select class="form-input">
                      <option>Disponibilidade única (lote)</option>
                      <option>Mensal</option>
                      <option>Quinzenal</option>
                      <option>Semanal</option>
                      <option>Contínuo</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Seção 3: Descrição técnica -->
              <div class="form-section">
                <p class="form-section-title">
                  <i class="fa-solid fa-flask"></i> 3. Descrição Técnica
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="form-label">Condição do Material</label>
                    <select class="form-input">
                      <option>Puro / Sem contaminação</option>
                      <option>Baixa contaminação</option>
                      <option>Requer triagem</option>
                    </select>
                  </div>
                  <div>
                    <label class="form-label">Estado (UF) *</label>
                    <select id="ann-uf" class="form-input" required>
                      <option value="">Selecione...</option>
                      <option>SP</option><option>RJ</option><option>MG</option>
                      <option>RS</option><option>SC</option><option>PR</option>
                      <option>BA</option><option>PE</option><option>GO</option>
                    </select>
                  </div>
                  <div class="sm:col-span-2">
                    <label class="form-label">Descrição Técnica Adicional</label>
                    <textarea class="form-input resize-none" rows="3"
                      placeholder="Origem, composição, laudo de análise..."></textarea>
                  </div>
                  <div class="sm:col-span-2">
                    <label class="form-label">Certificações / Laudos</label>
                    <div class="flex gap-4 flex-wrap">
                      <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" class="accent-green-600" /> Laudo laboratorial
                      </label>
                      <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" class="accent-green-600" /> ISO 14001
                      </label>
                      <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" class="accent-green-600" /> IBAMA aprovado
                      </label>
                      <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" class="accent-green-600" /> MTR emitido
                      </label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Ações -->
              <div class="flex gap-3 justify-end">
                <a href="./announcements.html" class="btn-secondary">
                  <i class="fa-solid fa-xmark mr-1.5"></i>Cancelar
                </a>
                <button type="submit" class="btn-primary">
                  <i class="fa-solid fa-paper-plane mr-1.5"></i>Salvar Anúncio
                </button>
              </div>

            </form>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/publish.js"></script>
</body>
</html>
