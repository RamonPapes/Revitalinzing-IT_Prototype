<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-IT — Relatório ESG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 w-80 pointer-events-none"></div>

  <div class="flex min-h-screen">
    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col lg:ml-64">
      <div id="header-container"></div>

      <main class="flex-1 p-5 lg:p-7">

        <!-- Score Banner -->
        <div id="esg-banner" class="rounded-2xl p-6 mb-6 flex flex-col sm:flex-row items-center justify-between gap-5">
          <div class="flex items-center gap-5">
            <div id="esg-grade-badge" class="w-24 h-24 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg">
              <span id="esg-grade-letter" class="text-4xl font-black text-white"></span>
            </div>
            <div>
              <p id="esg-grade-label" class="text-xs font-bold uppercase tracking-widest mb-1 opacity-80"></p>
              <h2 id="esg-grade-title" class="text-2xl font-bold mb-1"></h2>
              <p id="esg-grade-desc" class="text-sm opacity-75 max-w-sm"></p>
            </div>
          </div>
          <div class="flex flex-col items-center gap-1 flex-shrink-0">
            <div class="relative w-32 h-32">
              <svg class="rotate-[-90deg]" viewBox="0 0 120 120" width="128" height="128">
                <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="10"/>
                <circle id="esg-circle" cx="60" cy="60" r="52" fill="none" stroke="white" stroke-width="10"
                  stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke-linecap="round"
                  style="transition: stroke-dashoffset 1.2s ease"/>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="esg-score-num" class="text-3xl font-black text-white">0</span>
                <span class="text-xs text-white/70 font-medium">/ 100</span>
              </div>
            </div>
            <p class="text-white/70 text-xs font-medium">Pontuação ESG</p>
          </div>
        </div>

        <!-- Detalhamento dos critérios -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-6">

          <!-- Critérios de pontuação -->
          <div class="card">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-chart-bar text-green-600"></i>Critérios de Pontuação
            </h3>
            <div id="criteria-list" class="space-y-3"></div>
          </div>

          <!-- Impacto ambiental -->
          <div class="card">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-earth-americas text-green-600"></i>Impacto Ambiental
            </h3>
            <div class="space-y-4">
              <div class="bg-green-50 border border-green-200 rounded-xl p-4 flex items-center gap-4">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0">
                  <i class="fa-solid fa-cloud text-green-600 text-lg"></i>
                </div>
                <div>
                  <p class="text-xs text-green-600 font-semibold uppercase tracking-wide">CO₂ Total Evitado</p>
                  <p class="text-2xl font-bold text-green-700" id="env-co2">—</p>
                </div>
              </div>
              <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center flex-shrink-0">
                  <i class="fa-solid fa-weight-hanging text-blue-600 text-lg"></i>
                </div>
                <div>
                  <p class="text-xs text-blue-600 font-semibold uppercase tracking-wide">Volume Total Reciclado</p>
                  <p class="text-2xl font-bold text-blue-700" id="env-volume">—</p>
                </div>
              </div>
              <div class="bg-purple-50 border border-purple-200 rounded-xl p-4 flex items-center gap-4">
                <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center flex-shrink-0">
                  <i class="fa-solid fa-arrows-rotate text-purple-600 text-lg"></i>
                </div>
                <div>
                  <p class="text-xs text-purple-600 font-semibold uppercase tracking-wide">Trocas Circulares</p>
                  <p class="text-2xl font-bold text-purple-700" id="env-barters">—</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabela de classificações -->
        <div class="card">
          <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-trophy text-yellow-500"></i>Escala de Classificação ESG
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-5 gap-3" id="grade-scale"></div>
        </div>

        <!-- Recomendações -->
        <div class="card mt-5">
          <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-lightbulb text-yellow-500"></i>Recomendações para Melhorar seu Score
          </h3>
          <div id="recommendations" class="space-y-3"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/esg.js"></script>
</body>
</html>
