<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-IT — Histórico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 w-80 pointer-events-none"></div>

  <div class="flex min-h-screen">
    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col lg:ml-64">
      <div id="header-container"></div>

      <main class="flex-1 p-5 lg:p-7">

        <!-- Cards de resumo combinado -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-5">
          <div class="card flex items-center gap-3 py-3">
            <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-cloud text-green-600"></i>
            </div>
            <div>
              <p class="text-slate-400 text-xs">CO₂ Evitado</p>
              <p class="font-bold text-slate-800" id="sum-co2">—</p>
            </div>
          </div>
          <div class="card flex items-center gap-3 py-3">
            <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-arrows-left-right text-blue-600"></i>
            </div>
            <div>
              <p class="text-slate-400 text-xs">Vendas Concluídas</p>
              <p class="font-bold text-slate-800" id="sum-sales">—</p>
            </div>
          </div>
          <div class="card flex items-center gap-3 py-3">
            <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-right-left text-purple-600"></i>
            </div>
            <div>
              <p class="text-slate-400 text-xs">Trocas Concluídas</p>
              <p class="font-bold text-slate-800" id="sum-barters">—</p>
            </div>
          </div>
          <div class="card flex items-center gap-3 py-3">
            <div class="w-10 h-10 bg-yellow-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-weight-hanging text-yellow-600"></i>
            </div>
            <div>
              <p class="text-slate-400 text-xs">Volume Total</p>
              <p class="font-bold text-slate-800" id="sum-volume">—</p>
            </div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-1 bg-slate-100 rounded-xl p-1 mb-5 w-fit">
          <button id="tab-sales" onclick="switchHistTab('sales')"
            class="px-4 py-2 rounded-lg text-sm font-semibold bg-white shadow text-slate-800 transition-all">
            <i class="fa-solid fa-arrows-left-right mr-1.5"></i>Compra / Venda
          </button>
          <button id="tab-barters" onclick="switchHistTab('barters')"
            class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 transition-all">
            <i class="fa-solid fa-right-left mr-1.5"></i>Trocas
          </button>
        </div>

        <!-- Painel: Compra/Venda -->
        <div id="panel-sales" class="card overflow-x-auto">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-slate-800">Registro de Compra / Venda</h2>
            <button onclick="exportCSV('sales')" class="btn-secondary flex items-center gap-2 text-xs py-2 px-3">
              <i class="fa-solid fa-file-export"></i>Exportar CSV
            </button>
          </div>
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100">
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">ID</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Material</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden sm:table-cell">Parceiro</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Qtd. (kg)</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">Valor</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">CO₂ Evitado</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Status</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>

        <!-- Painel: Trocas -->
        <div id="panel-barters" class="card overflow-x-auto hidden">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-slate-800">Registro de Trocas</h2>
            <button onclick="exportCSV('barters')" class="btn-secondary flex items-center gap-2 text-xs py-2 px-3">
              <i class="fa-solid fa-file-export"></i>Exportar CSV
            </button>
          </div>
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100">
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">ID</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Você Enviou</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Você Recebeu</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden sm:table-cell">Parceiro</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">CO₂ Evitado</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Status</th>
              </tr>
            </thead>
            <tbody id="barter-history-body"></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/history.js"></script>
</body>
</html>
