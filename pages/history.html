<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-IT — Histórico de Trocas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 w-80 pointer-events-none"></div>

  <div class="flex min-h-screen">
    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col lg:ml-64">
      <div id="header-container"></div>

      <main class="flex-1 p-5 lg:p-7">

        <!-- Resumo ESG do histórico -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <div class="card flex items-center gap-4">
            <div class="w-11 h-11 bg-green-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-cloud text-green-600 text-lg"></i>
            </div>
            <div>
              <p class="text-slate-500 text-xs font-medium">CO₂ Total Evitado</p>
              <p class="text-xl font-bold text-slate-800" id="esg-co2">—</p>
            </div>
          </div>
          <div class="card flex items-center gap-4">
            <div class="w-11 h-11 bg-blue-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-arrows-left-right text-blue-600 text-lg"></i>
            </div>
            <div>
              <p class="text-slate-500 text-xs font-medium">Trocas Concluídas</p>
              <p class="text-xl font-bold text-slate-800" id="esg-concluded">—</p>
            </div>
          </div>
          <div class="card flex items-center gap-4">
            <div class="w-11 h-11 bg-yellow-100 rounded-xl flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-dollar-sign text-yellow-600 text-lg"></i>
            </div>
            <div>
              <p class="text-slate-500 text-xs font-medium">Volume Total Negociado</p>
              <p class="text-xl font-bold text-slate-800" id="esg-volume">—</p>
            </div>
          </div>
        </div>

        <div class="card overflow-x-auto">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-slate-800">Registro de Trocas</h2>
            <button onclick="exportCSV()" class="btn-secondary flex items-center gap-2 text-xs py-2 px-3">
              <i class="fa-solid fa-file-export"></i>Exportar CSV
            </button>
          </div>
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100">
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">ID</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Material</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden sm:table-cell">Empresa Parceira</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Qtd. (kg)</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">Valor</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide hidden md:table-cell">CO₂ Evitado</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Status</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/history.js"></script>
</body>
</html>
