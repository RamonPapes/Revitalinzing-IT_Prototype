<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-IT — Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

  <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 w-80 pointer-events-none"></div>

  <div class="flex min-h-screen">
    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col lg:ml-64">
      <div id="header-container"></div>

      <main class="flex-1 p-5 lg:p-7">

        <!-- Filtros -->
        <div class="card mb-5">
          <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex-1">
              <label class="form-label">Buscar material</label>
              <div class="relative">
                <i
                  class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input id="mkt-search" type="text" placeholder="Ex: Aparas de papel, PET..." class="form-input pl-9"
                  oninput="renderMarketplace()" />
              </div>
            </div>
            <div class="w-full sm:w-44">
              <label class="form-label">Tipo de material</label>
              <select id="mkt-type" class="form-input" onchange="renderMarketplace()">
                <option value="">Todos</option>
                <option>Papel / Papelão</option>
                <option>Plástico</option>
                <option>Metal / Sucata</option>
                <option>Madeira</option>
                <option>Óleo</option>
                <option>Borracha</option>
                <option>Têxtil</option>
              </select>
            </div>
            <div class="w-full sm:w-36">
              <label class="form-label">Estado (UF)</label>
              <select id="mkt-state" class="form-input" onchange="renderMarketplace()">
                <option value="">Todos</option>
                <option>SP</option>
                <option>RJ</option>
                <option>MG</option>
                <option>RS</option>
                <option>SC</option>
                <option>PR</option>
              </select>
            </div>
            <div class="w-full sm:w-36">
              <label class="form-label">Volume mín. (kg)</label>
              <select id="mkt-vol" class="form-input" onchange="renderMarketplace()">
                <option value="">Qualquer</option>
                <option value="100">100+ kg</option>
                <option value="500">500+ kg</option>
                <option value="1000">1.000+ kg</option>
                <option value="5000">5.000+ kg</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Barra de resultados -->
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm text-slate-500">
            <span id="mkt-count" class="font-semibold text-slate-800">0</span> anúncios disponíveis
          </p>
          <div class="flex gap-2">
            <button id="btn-grid" onclick="setView('grid')" title="Visualização em grade"
              class="w-9 h-9 rounded-lg bg-green-600 text-white flex items-center justify-center">
              <i class="fa-solid fa-grip"></i>
            </button>
            <button id="btn-list" onclick="setView('list')" title="Visualização em lista"
              class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center">
              <i class="fa-solid fa-list"></i>
            </button>
          </div>
        </div>

        <!-- Grade de cards -->
        <div id="mkt-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- Tabela (lista) -->
        <div id="mkt-list" class="hidden card overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100">
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Material
                </th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Empresa
                </th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Qtd. (kg)
                </th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">UF</th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Preço/kg
                </th>
                <th class="text-left py-2 px-3 text-xs font-semibold text-slate-400 uppercase tracking-wide">Ação</th>
              </tr>
            </thead>
            <tbody id="mkt-list-body"></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
     MODAL: Demonstrar Interesse
══════════════════════════════════════════════════ -->
  <div id="modal-interest" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-bg bg-black/40">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">

      <!-- Header -->
      <div class="flex items-center justify-between p-5 border-b border-slate-100">
        <div>
          <h3 class="font-bold text-slate-800" id="interest-title">Demonstrar Interesse</h3>
          <p class="text-xs text-slate-400 mt-0.5" id="interest-subtitle"></p>
        </div>
        <button onclick="closeModal('modal-interest')"
          class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 hover:bg-slate-200 flex-shrink-0 ml-4">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto max-h-[80vh]">
        <div id="interest-info" class="bg-slate-50 rounded-xl p-4 mb-5 text-sm text-slate-600"></div>

        <div class="mb-4">
          <label class="form-label">Quantidade desejada (kg) *</label>
          <input id="interest-qty" type="number" placeholder="0" min="1" class="form-input" />
        </div>

        <!-- INÍCIO: Opção de Troca -->
        <div class="mb-4">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" id="offer-trade"
              class="w-4 h-4 text-green-600 bg-slate-100 border-slate-300 rounded focus:ring-green-500"
              onchange="toggleTradeOptions()" />
            <span class="ml-2 text-sm font-medium text-slate-700">Oferecer material em troca</span>
          </label>
        </div>

        <div id="trade-options" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
          <div class="mb-3">
            <label class="form-label">Material do seu estoque</label>
            <select id="trade-item" class="form-input">
              <!-- Preenchido via JS -->
            </select>
          </div>
          <div>
            <label class="form-label">Quantidade sugerida (kg)</label>
            <input id="trade-qty" type="number" placeholder="Ex: 500" min="1" class="form-input" />
          </div>
        </div>
        <!-- FIM: Opção de Troca -->

        <div class="mb-5">
          <label class="form-label">Mensagem ao fornecedor</label>
          <textarea id="interest-msg" class="form-input resize-none" rows="3"
            placeholder="Descreva suas condições, prazo de entrega esperado, local de retirada..."></textarea>
        </div>

        <div class="flex gap-3 justify-end">
          <button onclick="closeModal('modal-interest')" class="btn-secondary">Cancelar</button>
          <button onclick="handleInterest()" class="btn-primary" id="btn-interest-submit">
            <i class="fa-solid fa-paper-plane mr-1.5"></i>Enviar Interesse
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/marketplace.js"></script>
</body>

</html>
